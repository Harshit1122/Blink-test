apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" . }}-validate-secrets
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: validate-secrets
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          if grep -r "{" /etc/config/ 2>/dev/null; then
            echo "ERROR: Found uninjected secret placeholders in values. Please replace placeholder values before deployment."
            exit 1
          fi
          echo "All values properly injected - no placeholder patterns found"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
      volumes:
      - name: config-volume
        configMap:
          name: {{ include "app.fullname" . }}-config